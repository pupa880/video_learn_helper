[project]
name = "video-learn-helper"
version = "0.1.0"
description = "视频（课程/演讲）学习辅助工具：本地/B站视频播放 + 字幕同步跳转 + ASR 转录 + AI 问答"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "yt-dlp>=2025.1.1",
    # ASR 默认安装。首次转录再下载模型权重。
    "faster-whisper>=1.1",
    "funasr>=1.2",
    "silero-vad>=5.1",
    "torch>=2.4",
    "torchaudio>=2.4",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# funasr → umap-learn → pynndescent 会把 numba/llvmlite 解析到只支持 Python <3.10 的旧版。
[tool.uv]
constraint-dependencies = [
    "numba>=0.61.0",
    "llvmlite>=0.44.0",
    "pynndescent>=0.6.0",
]
